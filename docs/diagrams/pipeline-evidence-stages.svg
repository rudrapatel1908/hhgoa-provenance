<svg width="100%" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>TRACE pipeline: image to evidence decision</title>
<desc>An image is analyzed for a face, the claimed source is fetched and compared, an independent live search of the original image runs, and an evidence decision yields VERIFIED or the stronger CORROBORATED.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .box { fill:#F1EFE8; stroke:#B4B2A9; }
  .th  { font-size:15px; font-weight:600; }
  .ts  { font-size:12px; }
  .c-neutral .th { fill:#2C2C2A; } .c-neutral .ts { fill:#5F5E5A; }
  .c-teal   { fill:#E1F5EE; stroke:#0F6E56; } .c-teal .th { fill:#085041; } .c-teal .ts { fill:#0F6E56; }
  .c-amber  { fill:#FAEEDA; stroke:#854F0B; } .c-amber .th { fill:#633806; } .c-amber .ts { fill:#854F0B; }
  .c-gray   { fill:#F1EFE8; stroke:#5F5E5A; } .c-gray .th  { fill:#444441; } .c-gray .ts  { fill:#5F5E5A; }
  .c-green  { fill:#EAF3DE; stroke:#3B6D11; } .c-green .th { fill:#27500A; } .c-green .ts { fill:#3B6D11; }
  .arr { stroke:#5F5E5A; stroke-width:1.5; }
  text { text-anchor:middle; }
</style>

<rect x="250" y="40" width="180" height="40" rx="8" class="box c-neutral" stroke-width="1"/>
<text x="340" y="64" class="th c-neutral" style="fill:#2C2C2A">Image</text>
<line x1="340" y1="80" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="110" width="300" height="56" rx="8" class="c-teal" stroke-width="1"/>
<text x="340" y="132" class="th c-teal">Face analysis</text>
<text x="340" y="150" class="ts c-teal">dlib &#183; 128-d embedding, pretrained only</text>
<line x1="340" y1="166" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="196" width="300" height="56" rx="8" class="c-teal" stroke-width="1"/>
<text x="340" y="218" class="th c-teal">Claimed source check</text>
<text x="340" y="236" class="ts c-teal">Fetch source, compare to input face</text>
<line x1="340" y1="252" x2="340" y2="282" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="282" width="300" height="56" rx="8" class="c-teal" stroke-width="1"/>
<text x="340" y="304" class="th c-teal">Live reverse-image search</text>
<text x="340" y="322" class="ts c-teal">Searches the ORIGINAL image</text>
<line x1="340" y1="338" x2="340" y2="368" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="368" width="300" height="56" rx="8" class="c-amber" stroke-width="1"/>
<text x="340" y="390" class="th c-amber">Evidence decision</text>
<text x="340" y="408" class="ts c-amber">Independently rediscovered?</text>

<path d="M340 424 L340 446 L175 446 L175 466" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M340 424 L340 446 L505 446 L505 466" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect x="80" y="466" width="190" height="56" rx="8" class="c-gray" stroke-width="1"/>
<text x="175" y="488" class="th c-gray">VERIFIED</text>
<text x="175" y="506" class="ts c-gray">Source valid only</text>

<rect x="410" y="466" width="190" height="56" rx="8" class="c-green" stroke-width="1"/>
<text x="505" y="488" class="th c-green">CORROBORATED</text>
<text x="505" y="506" class="ts c-green">Independently found</text>
</svg>
