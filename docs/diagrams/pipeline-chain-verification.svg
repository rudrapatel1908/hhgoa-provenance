<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>TRACE pipeline: manifest to on-chain verification</title>
<desc>Corroborated evidence becomes a canonical manifest, hashed with SHA-256, anchored on Polygon Amoy, then independently audited to confirm ON_CHAIN_VERIFIED or detect tampering.</desc>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .th  { font-size:15px; font-weight:600; }
  .ts  { font-size:12px; }
  .c-purple { fill:#EEEDFE; stroke:#534AB7; } .c-purple .th { fill:#3C3489; } .c-purple .ts { fill:#534AB7; }
  .c-green  { fill:#EAF3DE; stroke:#3B6D11; } .c-green .th  { fill:#27500A; } .c-green .ts  { fill:#3B6D11; }
  .c-red    { fill:#FCEBEB; stroke:#A32D2D; } .c-red .th    { fill:#791F1F; } .c-red .ts    { fill:#A32D2D; }
  .arr { stroke:#5F5E5A; stroke-width:1.5; }
  .note { font-size:11px; fill:#5F5E5A; font-style:italic; }
  text { text-anchor:middle; }
</style>

<rect x="190" y="40" width="300" height="56" rx="8" class="c-purple" stroke-width="1"/>
<text x="340" y="62" class="th c-purple">Provenance manifest</text>
<text x="340" y="80" class="ts c-purple">Canonical JSON, verification policy</text>
<line x1="340" y1="96" x2="340" y2="126" class="arr" marker-end="url(#arrow2)"/>

<rect x="190" y="126" width="300" height="56" rx="8" class="c-purple" stroke-width="1"/>
<text x="340" y="148" class="th c-purple">SHA-256 digest</text>
<text x="340" y="166" class="ts c-purple">Deterministic bytes32 hash</text>
<text x="565" y="197" class="note" text-anchor="start">+ optional IPFS pin</text>
<line x1="340" y1="182" x2="340" y2="212" class="arr" marker-end="url(#arrow2)"/>

<rect x="190" y="212" width="300" height="56" rx="8" class="c-purple" stroke-width="1"/>
<text x="340" y="234" class="th c-purple">Polygon Amoy</text>
<text x="340" y="252" class="ts c-purple">registerRecord on chain 80002</text>
<line x1="340" y1="268" x2="340" y2="298" class="arr" marker-end="url(#arrow2)"/>

<rect x="190" y="298" width="300" height="56" rx="8" class="c-purple" stroke-width="1"/>
<text x="340" y="320" class="th c-purple">Independent on-chain audit</text>
<text x="340" y="338" class="ts c-purple">Recompute hash, then compare</text>

<path d="M340 354 L340 376 L175 376 L175 396" fill="none" class="arr" marker-end="url(#arrow2)"/>
<path d="M340 354 L340 376 L505 376 L505 396" fill="none" class="arr" marker-end="url(#arrow2)"/>

<rect x="80" y="396" width="190" height="56" rx="8" class="c-green" stroke-width="1"/>
<text x="175" y="418" class="th c-green">ON_CHAIN_VERIFIED</text>
<text x="175" y="436" class="ts c-green">Hashes match</text>

<rect x="410" y="396" width="190" height="56" rx="8" class="c-red" stroke-width="1"/>
<text x="505" y="418" class="th c-red">TAMPER_DETECTED</text>
<text x="505" y="436" class="ts c-red">Hashes differ</text>
</svg>
